# ============================================================================
# Supabase CLI configuration (optional)
# ============================================================================
# Only needed if you want to use the Supabase CLI locally:
#   supabase link --project-ref <your-project-ref>
#   supabase db push                 # apply supabase/migrations/*
#   supabase functions deploy aisensy-webhook
#
# The dashboard works without the CLI — you can paste the SQL files into the
# Dashboard SQL Editor instead. See README.md.
# ============================================================================

project_id = "cobalt-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# The AiSensy webhook must accept calls from AiSensy's servers, which cannot
# present a Supabase JWT. Verification is therefore delegated to a shared
# secret checked inside the function (see supabase/functions/aisensy-webhook).
[functions.aisensy-webhook]
verify_jwt = false
